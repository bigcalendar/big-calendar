packages:
  - packages/*
  - apps/*
  - tools/*
  - tools/smoke/*
  - tools/fixtures/*

# Exact versions only (D-97).
saveExact: true
# Workspace packages resolve to each other, never to the registry.
linkWorkspacePackages: true
preferWorkspacePackages: true
allowBuilds:
  esbuild: true
  nx: true

overrides:
  # eslint-plugin-tsdoc pins an older typescript-eslint that predates TypeScript 6; use the
  # workspace's version (D-97).
  'eslint-plugin-tsdoc>@typescript-eslint/utils': 8.72.1
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vitest@5.1.0
  - '@babel/core@8.1.0'
  - '@babel/generator@8.1.0'
  - '@babel/helpers@8.1.0'
  - '@babel/parser@8.1.0'
  - '@babel/traverse@8.1.0'
  - '@babel/types@8.1.0'
  - '@vitejs/plugin-react@6.2.1'
