# Deploys the Storybook docs site to GitHub Pages on every merge to main (D-48).
name: Docs site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the site
        run: pnpm exec nx run docs:build-storybook
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/storybook-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
