# PR checks (D-48): formatting, commit messages, decision entries, then lint, typecheck, unit tests
# with coverage, build, boundaries, sizes, the binding line count, tree-shaking and the type checks,
# all for the projects the PR affects.
name: PR checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          browsers: chromium firefox webkit
      - name: Formatting
        run: pnpm format:check
      - name: Commit messages
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD
      - name: Decision entries
        run: node tools/ci/src/check-decisions.cli.ts origin/${{ github.base_ref }}
      - name: Nx workspace in sync
        run: pnpm exec nx sync:check
      - name: Lint, typecheck, test and build what changed
        run: pnpm exec nx affected -t lint typecheck test build --base=origin/${{ github.base_ref }}
