<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big Calendar P3 prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Big Calendar accessibility prototype (P3)</h1>
      <p>
        Throwaway test page for the P3 accessibility spec.
        <span id="today-note"></span> Jump to: <a href="?view=month">Month</a> ·
        <a href="?view=week">Week</a> ·
        <a href="?view=week&amp;date=2026-11-01">Fall-back week</a> ·
        <a href="?view=week&amp;date=2026-03-08">Spring-forward week</a>
      </p>
    </header>
    <main>
      <section id="calendar"></section>
      <aside class="app-log-panel" aria-labelledby="app-log-title">
        <h2 id="app-log-title">App callbacks</h2>
        <ol id="app-log" class="app-log"></ol>
      </aside>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
